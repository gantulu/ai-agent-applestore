name: Validate AI Agent

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Python runtime
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate JSON configuration and contracts
        run: |
          python3 -m json.tool config/category_direction.json > /dev/null
          python3 -m json.tool config/format_specification.json > /dev/null
          python3 -m json.tool config/database_category_mapping.json > /dev/null
          python3 -m json.tool schemas/input.schema.json > /dev/null
          python3 -m json.tool schemas/output.schema.json > /dev/null

      - name: Run automated tests
        run: python3 -m unittest discover -s tests -v
